name: Test Setup

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check secrets are configured
        env:
              OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
              WP_EMAIL: ${{ secrets.WP_EMAIL }}
              TO_EMAIL: ${{ secrets.TO_EMAIL }}
              WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
        run: |
          if [ -z "$OWM_API_KEY" ]; then
            echo "OWM_API_KEY secret is not set!"
            exit 1
          else
            echo "OWM_API_KEY is configured"
          fi

          if [ -z "$WP_EMAIL" ]; then
            echo "WP_EMAIL secret is not set!"
            exit 1
          else
            echo "WP_EMAIL is configured"
          fi

          if [ -z "$TO_EMAIL" ]; then
            echo "TO_EMAIL secret is not set!"
            exit 1
          else
            echo "TO_EMAIL is configured"
          fi

          if [ -z "$WP_PASSWORD" ]; then
            echo "PASSWORD secret is not set!"
            exit 1
          else
            echo "WP_PASSWORD is configured"
          fi

          echo ""
          echo "All secrets are configured!"

      - name: Check required files exist
        run: |
          echo "Checking for required files..."

          if [ -f "main.py" ]; then
            echo "main.py found"
          else
            echo "main.py not found!"
            exit 1
          fi

          if [ -f "requirements.txt" ]; then
            echo "requirements.txt found"
          else
            echo "requirements.txt not found!"
            exit 1
          fi

          echo ""
          echo "All required files found!"

      - name: Test Python syntax
        run: python -m py_compile main.py && echo "Python syntax OK"

      - name: Success
        run: |
          echo ""
          echo "========================================"
          echo "  All checks passed!"
          echo "  Your setup is ready to go."
          echo "========================================"
